name: Memory Qdrant isolated contract
on:
  workflow_dispatch:
  push:
    branches: [refactor/architecture-v1]
    paths:
      - 'core/indexing/**'
      - 'core/retrieval/**'
      - 'tests/test_recall_freshness_g242.py'
      - 'tests/test_recall_proof_g243.py'
      - 'tests/test_memory_bridge_write_deadline_g257.py'
      - 'tests/test_qdrant_index.py'
      - 'tests/test_worker_upsert.py'
      - 'tests/test_worker_integrity.py'
      - 'tests/test_worker_canonical.py'
      - 'tests/test_worker_journal.py'
      - 'tests/test_reconcile_integrity.py'
      - 'tests/test_reconcile_scan.py'
      - 'tests/test_orphan_scan.py'
      - 'tests/test_index_maintenance.py'
      - 'tests/test_maintenance_recovery_g236.py'
      - 'tests/test_maintenance_read_budget_g237.py'
      - 'tests/test_worker_read_budget_g237.py'
      - 'tests/test_scan_incompatibility_g239.py'
      - 'tests/test_index_projection.py'
      - 'tests/claude_memory_eval/**'
      - '.github/workflows/memory-qdrant-contract.yml'
jobs:
  qdrant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EIDOLON_TEST_QDRANT_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1 "PyYAML>=6.0.2" 'qdrant-client>=1.12,<2'
      - name: Compile
        run: python -m compileall -q core/indexing tests/test_qdrant_index.py tests/test_worker_upsert.py
      - name: In-memory Qdrant and worker tests
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_qdrant_index.py tests/test_recall_freshness_g242.py tests/test_recall_proof_g243.py tests/test_qdrant_recall.py tests/test_indexed_recall.py tests/test_worker_upsert.py tests/test_worker_integrity.py tests/test_worker_canonical.py tests/test_worker_journal.py tests/test_worker_read_budget_g237.py tests/test_reconcile_integrity.py tests/test_reconcile_scan.py tests/test_orphan_scan.py tests/test_index_maintenance.py tests/test_worker_port_g253.py tests/test_maintenance_recovery_g236.py tests/test_maintenance_read_budget_g237.py tests/test_index_projection.py tests/test_scan_incompatibility_g239.py tests/claude_memory_eval/test_real_worker_contract_g220.py tests/claude_memory_eval/test_qdrant_generation_probes_g220.py tests/claude_memory_eval/test_rebuild_proof_probes_g235.py tests/claude_memory_eval/test_maintenance_probes_g234.py tests/claude_memory_eval/test_g236_g237_reviews.py tests/claude_memory_eval/test_index_port_split_g236.py tests/claude_memory_eval/test_recall_guard_probes_g251.py tests/claude_memory_eval/test_bridge_saturation_probes_g251.py tests/test_memory_bridge_write_deadline_g257.py tests/claude_memory_eval/test_bridge_transport_probes_g252.py tests/claude_memory_eval/test_g252_reviews.py tests/claude_memory_eval/test_generation_retention_g252.py tests/claude_memory_eval/test_archive_passage_slice_g252.py tests/test_index_lag.py tests/test_index_lag_unknown_g250.py tests/test_index_lag_range_g251.py --basetemp="$RUNNER_TEMP/qdrant-tests"
