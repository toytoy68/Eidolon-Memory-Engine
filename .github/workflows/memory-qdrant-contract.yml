name: Memory Qdrant isolated contract
on:
  workflow_dispatch:
  push:
    branches: [refactor/architecture-v1]
    paths:
      - 'core/indexing/**'
      - 'tests/test_qdrant_index.py'
      - 'tests/test_worker_upsert.py'
      - 'tests/test_worker_integrity.py'
      - 'tests/test_worker_canonical.py'
      - 'tests/test_worker_journal.py'
      - 'tests/test_reconcile_integrity.py'
      - 'tests/test_reconcile_scan.py'
      - 'tests/test_orphan_scan.py'
      - 'tests/test_index_maintenance.py'
      - '.github/workflows/memory-qdrant-contract.yml'
jobs:
  qdrant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EIDOLON_TEST_QDRANT_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependencies
        run: python -m pip install pytest==9.1.1 "PyYAML>=6.0.2" 'qdrant-client>=1.12,<2'
      - name: Compile
        run: python -m compileall -q core/indexing tests/test_qdrant_index.py tests/test_worker_upsert.py
      - name: In-memory Qdrant and worker tests
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_qdrant_index.py tests/test_worker_upsert.py tests/test_worker_integrity.py tests/test_worker_canonical.py tests/test_worker_journal.py tests/test_reconcile_integrity.py tests/test_reconcile_scan.py tests/test_orphan_scan.py tests/test_index_maintenance.py --basetemp="$RUNNER_TEMP/qdrant-tests"
