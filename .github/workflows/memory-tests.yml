name: Memory isolated tests
on:
  workflow_dispatch:
  push:
    branches: [refactor/architecture-v1]
    paths:
      - 'core/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/memory-tests.yml'
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MEMORY_ENGINE_ROOT: ${{ runner.temp }}/eidolon-memory-tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare isolated root
        run: mkdir -p "$MEMORY_ENGINE_ROOT" && chmod 700 "$MEMORY_ENGINE_ROOT"
      - name: Compile
        run: python -m compileall -q core tests
      - name: Full isolated suite
        run: python -m pytest -q -p no:cacheprovider --basetemp="${{ runner.temp }}/pytest-memory"
