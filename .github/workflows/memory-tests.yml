name: Memory isolated tests
on:
  workflow_dispatch:
  push:
    branches: [refactor/architecture-v1]
    paths:
      - 'core/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/memory-tests.yml'
concurrency:
  group: memory-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt 'qdrant-client>=1.12,<2'
      - name: Prepare isolated root
        run: |
          echo "MEMORY_ENGINE_ROOT=$RUNNER_TEMP/eidolon-memory-tests" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/eidolon-memory-tests"
          chmod 700 "$RUNNER_TEMP/eidolon-memory-tests"
      - name: Compile
        run: python -m compileall -q core tests
      - name: Full isolated suite
        run: python -m pytest -q -rs -p no:cacheprovider --basetemp="${{ runner.temp }}/pytest-memory"
